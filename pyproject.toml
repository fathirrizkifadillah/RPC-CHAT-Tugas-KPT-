[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-chat-room-rpc"
version = "1.0.0"
description = "Distributed Chat Room with gRPC and Python for Komputasi Paralel dan Terdistribusi"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kelompok Praktikum KPT", email = "mahasiswa@example.ac.id" }
]
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
chat-server = "chat_room.server:main"
chat-client = "chat_room.client:main"
chat-benchmark = "chat_room.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
